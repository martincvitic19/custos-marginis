# Distribution policy for Custos: DISTRO_FEATURES, security flags, compiler
# hardening.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "custos-distro"
BBFILE_PATTERN_custos-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_custos-distro = "8"

LAYERDEPENDS_custos-distro = "core"
LAYERSERIES_COMPAT_custos-distro = "wrynose"
