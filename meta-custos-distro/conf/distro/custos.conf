# Custos Marginis distribution: Poky plus the security policy of the
# product. Everything here is policy (features, defaults); recipes live in
# meta-custos.
require conf/distro/poky.conf

DISTRO = "custos"
DISTRO_NAME = "Custos Marginis"
DISTRO_VERSION = "0.2"
DISTRO_CODENAME = "a13"
MAINTAINER = "Custos Marginis"

INIT_MANAGER = "systemd"

# The journal is the only log. busybox syslogd takes /dev/log away from
# journald, and then syslog() messages (dropbear logins) never reach the
# journal: sshguard, which reads the journal, was blind until 2026-11-22.
VIRTUAL-RUNTIME_base-utils-syslog = ""

# A router: no graphics, sound, Bluetooth, NFC, 3G, test suites.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan alsa pulseaudio bluetooth nfc 3g ptest gobject-introspection-data"

# Fixed UIDs/GIDs: files on /data are shared by both A/B slots and by every
# version, so the numbers must not depend on which packages are installed.
# A new account without an entry in the tables makes its recipe unbuildable.
USERADDEXTENSION = "useradd-staticids"
USERADD_UID_TABLES = "files/custos-passwd"
USERADD_GID_TABLES = "files/custos-group"
USERADD_ERROR_DYNAMIC = "error"

# Local time for logs; curfew uses custos.json (Europe/Zagreb) anyway.
DEFAULT_TIMEZONE = "Europe/Zagreb"
