# ESPRESSObin additions on top of arm64 defconfig.

# 88E6341 "Topaz" switch built in, so DSA user ports exist before the
# root filesystem is mounted (NFS root over lan0/lan1/wan). NET_DSA
# "depends on BRIDGE || BRIDGE=n" and "HSR || HSR=n", and BRIDGE on
# "IPV6 || IPV6=n", so those must be built in as well (all =m in defconfig).
CONFIG_IPV6=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_HSR=y
CONFIG_VLAN_8021Q=y
CONFIG_NET_DSA=y
CONFIG_NET_DSA_MV88E6XXX=y
CONFIG_MARVELL_PHY=y

# Armada 3720 SoC blocks that arm64 defconfig leaves disabled.
# Watchdog (marvell,armada-3700-wdt), used by systemd RuntimeWatchdogSec
CONFIG_ARMADA_37XX_WATCHDOG=y
# SafeXcel EIP97 crypto engine (inside-secure,safexcel-eip97ies)
CONFIG_CRYPTO_DEV_SAFEXCEL=m

# Already =y in arm64 defconfig; listed so the kernel config audit warns if
# a future defconfig drops them.
# Ethernet conduit (eth0)
CONFIG_MVNETA=y
# microSD / eMMC controller
CONFIG_MMC_SDHCI_XENON=y
# NFS root for netboot
CONFIG_IP_PNP=y
CONFIG_NFS_FS=y
CONFIG_NFS_V3=y
CONFIG_ROOT_NFS=y
