#@TYPE: Machine
#@NAME: Globalscale ESPRESSObin
#@DESCRIPTION: Marvell Armada 3720 (2x Cortex-A53), 88E6341 switch, booted by
#@DESCRIPTION: the factory SPI-NOR U-Boot from microSD (no bootloader built).

require conf/machine/include/arm/armv8a/tune-cortexa53.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
KERNEL_IMAGETYPE = "Image"

# V7 board with the 4 GB eMMC populated. Other revisions: set to
# armada-3720-espressobin-v7.dtb (no eMMC), armada-3720-espressobin.dtb (V5)
# or armada-3720-espressobin-emmc.dtb (V5 + eMMC).
ESPRESSOBIN_DTB ?= "armada-3720-espressobin-v7-emmc.dtb"
KERNEL_DEVICETREE = "marvell/${ESPRESSOBIN_DTB}"

SERIAL_CONSOLES = "115200;ttyMV0"

MACHINE_FEATURES = "ext2 serial usbhost vfat"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# microSD image; the tarball is used as the NFS root during netboot
IMAGE_FSTYPES += "wic.bz2 wic.bmap tar.bz2"
WKS_FILE ?= "espressobin.wks"
# Booted by the factory U-Boot (boot.scr), not EFI: don't build the
# grub-efi/systemd-boot binaries that wic pulls in by default on aarch64.
WKS_FILE_DEPENDS_BOOTLOADERS = ""
IMAGE_BOOT_FILES ?= "${KERNEL_IMAGETYPE} ${ESPRESSOBIN_DTB} boot.scr"
do_image_wic[depends] += "espressobin-boot-script:do_deploy"
