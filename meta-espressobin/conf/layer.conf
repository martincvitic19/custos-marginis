# BSP layer for the Globalscale ESPRESSObin (Marvell Armada 3720).
# Hardware support only: no distro or image policy.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "espressobin"
BBFILE_PATTERN_espressobin = "^${LAYERDIR}/"
BBFILE_PRIORITY_espressobin = "6"

LAYERDEPENDS_espressobin = "core"
LAYERSERIES_COMPAT_espressobin = "wrynose"
