# Custos application layer: daemons, packagegroup for custos applications, custos-image.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "custos"
BBFILE_PATTERN_custos = "^${LAYERDIR}/"
BBFILE_PRIORITY_custos = "9"

LAYERDEPENDS_custos = "core custos-distro"
LAYERSERIES_COMPAT_custos = "wrynose"
