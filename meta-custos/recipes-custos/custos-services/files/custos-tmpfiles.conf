# Custos state on /data (persistent) and /run (generated at every boot).
# /data/custos: custos.json, state, secrets, event log. Group custos:
# custosd (edits custos.json) and custos-watch (writes events) are in it.
# Others get search (x) only, no listing: systemd-networkd (user
# systemd-network, not in group custos) must reach wg/wg0.key by name. Every
# file below keeps its own mode (no world read), so nothing else opens up.
# Without it networkd logs "Failed to read private key ... Permission
# denied" and wg0 is never created (first A/B image boot, 2026-11-21).
d /data/custos            2771 root     custos   -
f /data/custos/events.jsonl 0660 root   custos   -
d /data/custos/wg         0750 root     systemd-network -
d /data/custosd           0700 custosd  custos   -
d /run/custos             0755 root     root     -
d /run/custos/firewall    0700 root     root     -
