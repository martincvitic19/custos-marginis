# Custos edge router kernel settings. Sorts after systemd's 50-default.conf,
# which sets loose reverse-path filtering (2) for every interface.

# Route between the LAN VLANs and wan.
net.ipv4.ip_forward = 1

# Strict reverse-path filtering: drop packets whose source would not be
# routed back out of the interface they arrived on (spoofed LAN sources).
# The glob also covers VLAN interfaces created later (applied by udev).
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.*.rp_filter = 1

# A router does not take routing hints from its clients.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
