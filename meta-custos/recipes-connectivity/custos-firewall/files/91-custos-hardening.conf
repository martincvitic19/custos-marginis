# Custos kernel hardening (A9/A10). Safe at run time; no effect on routing.
# BPF: only root may load programs, JIT output hardened against spraying.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Kernel pointers and log only for root.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# No ptrace between unrelated processes.
-kernel.yama.ptrace_scope = 2
# Reject IPv6 router advertisements and redirects (clients get no IPv6).
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Log packets with impossible source addresses.
net.ipv4.conf.all.log_martians = 1
# SYN flood: cookies when the backlog is full.
net.ipv4.tcp_syncookies = 1
