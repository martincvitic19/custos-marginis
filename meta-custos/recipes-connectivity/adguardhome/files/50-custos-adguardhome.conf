# AdGuard Home owns port 53 on every address (it binds 0.0.0.0:53), so the
# resolved stub listener on 127.0.0.53:53 / 127.0.0.54:53 must be off.
# The router's own lookups are unaffected: /etc/resolv.conf points to
# /run/systemd/resolve/resolv.conf (the uplink DNS servers), not the stub.
[Resolve]
DNSStubListener=no
