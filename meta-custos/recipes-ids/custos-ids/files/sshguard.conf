# sshguard (A12): blocks addresses after repeated SSH login failures.
# SSH is reachable only from the admin VLAN anyway; this stops guessing
# from a compromised adult device. Block list in nft table "sshguard".
BACKEND="/usr/libexec/sshg-fw-nft-sets"
# sshguard's own parser knows OpenSSH only, not dropbear.
PARSER="/usr/sbin/custos-sshg-parser"
LOGREADER="LANG=C /usr/bin/journalctl -afb -p info -n1 -o cat -t dropbear"
THRESHOLD=30
BLOCK_TIME=600
DETECTION_TIME=1800
WHITELIST_ARG=127.0.0.0/8
