# AIDE (A10/A12): integrity of what must only change through an image
# update or custos-apply. Database on /data (first boot: --init).
database_in=file:/data/aide/aide.db
database_out=file:/data/aide/aide.db.new
gzip_dbout=no
report_url=stdout
CUSTOS = p+i+n+u+g+s+b+m+c+sha256
/usr/bin CUSTOS
/usr/sbin CUSTOS
/usr/lib/systemd/system CUSTOS
/usr/lib/sysctl.d CUSTOS
/usr/lib/modprobe.d CUSTOS
/etc/custos CUSTOS
/etc/ssl/certs CUSTOS
/etc/passwd CUSTOS
/etc/shadow CUSTOS
/etc/group CUSTOS
/data/custos/wg CUSTOS
/data/custosd/auth.json CUSTOS
