# Image configuration for the ESPRESSObin development image: root SSH key,
# dropbear policy and systemd-networkd setup for the DSA switch ports.
# Not a BSP layer; selected from local.conf (see conf-templates/).
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "espressobin-image"
BBFILE_PATTERN_espressobin-image = "^${LAYERDIR}/"
BBFILE_PRIORITY_espressobin-image = "7"

LAYERDEPENDS_espressobin-image = "core"
LAYERSERIES_COMPAT_espressobin-image = "wrynose"

# Root of the espressobin-yocto checkout; local.conf places downloads,
# sstate and the SSH key relative to it.
ESPRESSOBIN_TOPDIR := "${@os.path.normpath(os.path.join('${LAYERDIR}', '..'))}"
