# Custos (A13): read the host key from /data (see dropbearkey.service.d).
[Unit]
RequiresMountsFor=/data

[Service]
# The path is spelled out instead of using DROPBEAR_RSAKEY_DIR: with
# IMAGE_FEATURES read-only-rootfs, oe-core writes
# DROPBEAR_RSAKEY_DIR=/var/lib/dropbear into /etc/default/dropbear, and an
# EnvironmentFile= overrides Environment=.
ExecStart=
ExecStart=-/usr/sbin/dropbear -i -r /data/dropbear/dropbear_rsa_host_key $DROPBEAR_EXTRA_ARGS
