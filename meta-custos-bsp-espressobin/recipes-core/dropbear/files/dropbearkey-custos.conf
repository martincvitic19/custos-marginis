# Custos (A13): the SSH host key is on /data, shared by both A/B slots.
[Unit]
RequiresMountsFor=/data
# Drop the upstream "no key in /etc or /var/lib" conditions: the script
# below keeps an existing /data key, else takes over the key this slot
# already generated (no host key change on the first update), else makes one.
ConditionPathExists=

[Service]
ExecStart=
ExecStart=/bin/sh -c 'k=/data/dropbear/dropbear_rsa_host_key; test -s $k && exit 0; mkdir -p -m 0700 /data/dropbear; if test -s /etc/dropbear/dropbear_rsa_host_key; then cp -p /etc/dropbear/dropbear_rsa_host_key $k; else /usr/sbin/dropbearkey -t rsa -f $k; fi; if command -v restorecon >/dev/null; then restorecon -R /data/dropbear; fi'
