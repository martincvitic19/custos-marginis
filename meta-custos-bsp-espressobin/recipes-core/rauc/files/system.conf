# Custos Marginis RAUC system configuration (A13), ESPRESSObin microSD.
[system]
compatible=custos-espressobin
# The factory U-Boot cannot count boots without writing its environment in
# SPI NOR (not done, rule 2): slot selection lives in a file on the boot
# partition, boot counting and fallback in Linux (custos-bootchooser).
bootloader=custom
statusfile=/data/rauc/status.raucs
max-bundle-download-size=2147483648
bundle-formats=-plain

[handlers]
bootloader-custom-backend=/usr/lib/custos/custos-bootchooser
# A10: root hash of the new slot and boot.scr from the bundle to the boot
# partition (custos-rauc-post-install).
post-install=/usr/lib/custos/custos-rauc-post-install

[keyring]
path=/usr/lib/rauc/ca.cert.pem
check-crl=false
# The signing certificate carries extendedKeyUsage=codeSigning (keys/rauc/
# ext.cnf). RAUC's default purpose check is S/MIME signing, which rejects it
# with "unsuitable certificate purpose" (seen 2026-11-21 on the first
# rauc install). "codesign" is supported since RAUC 1.5.
check-purpose=codesign

[slot.rootfs.0]
device=/dev/mmcblk1p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk1p3
type=ext4
bootname=B
