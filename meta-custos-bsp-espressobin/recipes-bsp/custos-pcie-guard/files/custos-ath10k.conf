# Do not let udev load ath10k_pci automatically. On the Armada 3720
# (Aardvark PCIe controller) a card that does not answer on the link turns
# the driver's first register access into an SError and a kernel panic
# (seen with the Compex WLE900VX on 2026-11-20). custos-pcie-guard.service
# loads the driver only after the card answered a config space read.
blacklist ath10k_pci
