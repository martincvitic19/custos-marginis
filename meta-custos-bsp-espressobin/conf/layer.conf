# ESPRESSObin BSP extensions for the Custos stack: machine-specific kernel
# fragments, DSA bridge topology, hardware-specific overrides.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "custos-bsp-espressobin"
BBFILE_PATTERN_custos-bsp-espressobin = "^${LAYERDIR}/"
BBFILE_PRIORITY_custos-bsp-espressobin = "10"

LAYERDEPENDS_custos-bsp-espressobin = "core custos espressobin"
LAYERSERIES_COMPAT_custos-bsp-espressobin = "wrynose"
