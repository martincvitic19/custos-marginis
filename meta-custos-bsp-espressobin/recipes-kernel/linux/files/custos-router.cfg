# CAKE qdisc on the wan port (configured by systemd-networkd [CAKE]).
# Must be a module: CAKE's NAT-aware flow isolation only works when
# nf_conntrack is reachable, and NF_CONNTRACK is =m in arm64 defconfig.
CONFIG_NET_SCH_CAKE=m

# Already set by defconfig or espressobin.cfg; listed so the kernel config
# audit warns if a future defconfig drops something the router relies on.
CONFIG_NET_SCHED=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_VLAN_8021Q=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_LIMIT=m

# DNS enforcement (A3): redirect client DNS to AdGuard Home, reject
# DoT/DoQ/DoH. Already =m in the current build; listed for the audit.
CONFIG_NF_NAT_REDIRECT=y
CONFIG_NFT_REDIR=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_REJECT_INET=m
CONFIG_NF_REJECT_IPV4=m
CONFIG_NF_REJECT_IPV6=m

# The input chain matches "fib daddr . iif type local" (ping own gateway).
# Without these, nft fails with "No such file or directory" on that rule
# and the whole firewall (and with it networkd and SSH) stays down; seen on
# the first A/B image boot, 2026-11-20.
CONFIG_NFT_FIB_IPV4=m
CONFIG_NFT_FIB_IPV6=m
CONFIG_NFT_FIB_INET=m

# A6 curfew: conntrack -D needs the ctnetlink interface.
CONFIG_NF_CT_NETLINK=m

# A7 VPN: WireGuard server (wg0) and Mullvad client (wg-mullvad), and policy
# routing so traffic from wg0 uses its own table (default via wg-mullvad).
CONFIG_WIREGUARD=m
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y

# A10 hardening that cannot stop the board from booting. Module signature
# enforcement and lockdown are in hardening-enforce.cfg (not enabled yet,
# see docs/boot-chain.md).
CONFIG_HARDENED_USERCOPY=y
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
# Yama (ptrace restrictions) and the lockdown LSM, built in but NOT forced:
# custos-lockdown.service switches lockdown to "integrity" late in boot
# (one way, until reboot). Forcing it from boot, together with module
# signature enforcement, is A10 future work (docs/boot-chain.md).
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE=y

# A11: SELinux in the active LSM list. meta-selinux's selinux.cfg turns
# SELinux on but leaves the LSM order alone. (Never start a comment line
# here with a config symbol: kconfig reads "# SYMBOL ..." as "not set".)
CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,selinux,ipe,bpf"

# A10: every module is signed at build time (key generated in the kernel
# build directory, never in a layer) and unsigned modules are rejected.
# Checked on 2026-11-20: all packaged modules keep their signature
# (400/400, kernel not tainted), so enforcing is safe.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA512=y
CONFIG_MODULE_SIG_FORCE=y

# A9/A12: tc-BPF and XDP programs.
CONFIG_NET_CLS_BPF=m
CONFIG_NET_ACT_BPF=m
CONFIG_BPF_JIT=y
