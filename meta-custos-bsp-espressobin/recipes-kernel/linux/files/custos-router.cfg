# CAKE qdisc on the wan port (configured by systemd-networkd [CAKE]).
# Must be a module: CAKE's NAT-aware flow isolation only works when
# nf_conntrack is reachable, and NF_CONNTRACK is =m in arm64 defconfig.
CONFIG_NET_SCH_CAKE=m

# Already set by defconfig or espressobin.cfg; listed so the kernel config
# audit warns if a future defconfig drops something the router relies on.
CONFIG_NET_SCHED=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_VLAN_8021Q=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_LIMIT=m
