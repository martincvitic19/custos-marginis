# CAKE qdisc on the wan port (configured by systemd-networkd [CAKE]).
# Must be a module: CAKE's NAT-aware flow isolation only works when
# nf_conntrack is reachable, and NF_CONNTRACK is =m in arm64 defconfig.
CONFIG_NET_SCH_CAKE=m

# Already set by defconfig or espressobin.cfg; listed so the kernel config
# audit warns if a future defconfig drops something the router relies on.
CONFIG_NET_SCHED=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_VLAN_8021Q=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_LIMIT=m

# DNS enforcement (A3): redirect client DNS to AdGuard Home, reject
# DoT/DoQ/DoH. Already =m in the current build; listed for the audit.
CONFIG_NF_NAT_REDIRECT=y
CONFIG_NFT_REDIR=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_REJECT_INET=m
CONFIG_NF_REJECT_IPV4=m
CONFIG_NF_REJECT_IPV6=m

# The input chain matches "fib daddr . iif type local" (ping own gateway).
# Without these, nft fails with "No such file or directory" on that rule
# and the whole firewall (and with it networkd and SSH) stays down; seen on
# the first A/B image boot, 2026-11-20.
CONFIG_NFT_FIB_IPV4=m
CONFIG_NFT_FIB_IPV6=m
CONFIG_NFT_FIB_INET=m
